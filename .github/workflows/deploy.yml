# Copies blog posts onto the site, refreshes videos and podcast episodes, saves the result, then deploys to GitHub Pages
name: Update content and deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Twice a day, 9:00 AM and 9:00 PM Minnesota time (daylight saving handled automatically)
  schedule:
    - cron: "0 9,21 * * *"
      timezone: "America/Chicago"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write lets the run save imported posts back to the repository
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install the HTML cleaner
        run: python -m pip install --quiet "beautifulsoup4>=4.12,<5"

      - name: Copy blog posts, update videos and podcast episodes
        # If a feed is down, its pages and sections keep their current content.
        run: python .github/scripts/update_feeds.py

      - name: Save changes to the repository
        # Keeps the imported posts in the repository, so a later outage can never remove them.
        # Pushes made with the built-in token don't start another run.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit --quiet -m "Update posts, videos and episodes from feeds"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet origin "HEAD:${GITHUB_REF_NAME}" \
              || echo "Could not save this time (someone pushed at the same moment). The next run will save it."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload entire repository (.git, .github and other dot-files are left out)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
